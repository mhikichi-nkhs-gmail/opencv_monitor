[socket]
# ソケットサーバー設定
host = 0.0.0.0
port = 8080
buffer_size = 65536

[api]
# REST API設定（ET ROBOT CONTEST API仕様）
url = http://localhost:5000/snap
timeout = 30
max_retries = 3
retry_delay = 1.0

[server]
# サーバー設定
max_workers = 3
log_level = INFO

[evidence]
# 証拠保全設定
save_images = True
save_dir = evidence_images
save_metadata = True
