# 画像提出サーバー設定ファイル
# ET ROBOT CONTEST 画像提出システム

[socket]
# ソケットサーバー設定
host = 0.0.0.0
port = 8080
buffer_size = 65536

[api]
# REST API設定
url = http://192.168.100.1/snap
timeout = 30
max_retries = 10
retry_delay = 5.0
team_id = 300

[server]
# サーバー設定
max_workers = 3
log_level = INFO

[image]
# 画像変換設定
target_width = 800
target_height = 600
jpeg_quality = 95

[evidence]
# 証拠保全設定
save_images = True
save_dir = evidence_images
save_metadata = True
