[server]
# 中継サーバー設定（Raspberry Piから接続するサーバー）
host = 192.168.1.100
port = 8080
timeout = 30.0

[monitor]
# 監視設定（Raspberry Pi用）
directory = /home/pi/monitor_images
image_extensions = .jpg,.jpeg,.png,.bmp
delay = 2.0

[logging]
# ログ設定（Raspberry Pi用）
level = INFO
file = /home/pi/logs/folder_monitor.log

[raspberrypi]
# Raspberry Pi固有設定
camera_enabled = false
camera_resolution = 1920x1080
camera_framerate = 30
auto_start = false


