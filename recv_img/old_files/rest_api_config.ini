[server]
# サーバー設定
host = 0.0.0.0
port = 5000
debug = false
max_file_size = 52428800

[storage]
# ストレージ設定
upload_directory = received_images
database_path = images.db
backup_directory = backups

[security]
# セキュリティ設定
require_auth = true
token_expiry_days = 30
max_upload_size_mb = 50
allowed_extensions = .jpg,.jpeg,.png,.bmp,.gif,.tiff

[processing]
# 画像処理設定
enable_processing = true
processing_threads = 2
processing_delay_min = 0.1
processing_delay_max = 2.0

[logging]
# ログ設定
level = INFO
file = rest_api_stub.log
max_file_size_mb = 10
backup_count = 5

[api]
# API設定
cors_enabled = true
rate_limit_enabled = false
rate_limit_requests = 100
rate_limit_window = 3600
